services:
  api:
    build: .
    image: issue-tracker
    container_name: issue-tracker
    ports:
      - "8000:8000"
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      # Keep issue data across container rebuilds / `docker compose down`.
      - issue-data:/app/data
    develop:
      # Bind mounts from Windows don't deliver file-change events to the container,
      # so sync edits into it instead; uvicorn --reload picks them up via inotify.
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - .venv/
            - __pycache__/
            - data/
        - action: rebuild
          path: requirements.txt

volumes:
  issue-data:
